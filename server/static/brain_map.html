<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEODAERY BRAIN MAP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',Courier,monospace;background:#0d0d0d;color:#c2c0b6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.spinner{animation:spin .8s linear infinite;display:inline-block}

.top-bar{padding:10px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.title{font-size:13px;font-weight:700;letter-spacing:.1em;color:#e8e6dc}
.sub{font-size:9px;color:#444;margin-top:1px}
#badge{font-size:9px;padding:2px 10px;border-radius:99px;border:1px solid #333;color:#555;transition:all .3s}

.pipeline{display:flex;gap:3px;padding:8px 16px;flex-shrink:0}
.pipe{flex:1;padding:4px 6px;border-radius:5px;border:1px solid #1a1a1a;opacity:.3;transition:all .3s}
.pipe .dot{width:4px;height:4px;border-radius:50%;display:inline-block;margin-right:4px}
.pipe .nm{font-size:9px;font-weight:700}
.pipe .sm{font-size:8px;color:#333;margin-top:1px}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.chat-col{flex:1;display:flex;flex-direction:column}
#chat-log{flex:1;overflow-y:auto;padding:12px 16px;font-size:12px;line-height:1.7}
.msg{margin-bottom:10px}
.msg-user .msg-name{color:#888;font-size:10px;font-weight:700}
.msg-bot .msg-name{color:#1D9E75;font-size:10px;font-weight:700}
.msg-sys .msg-name{color:#BA7517;font-size:10px;font-weight:700}
.msg-text{margin-top:2px;color:#999}
.msg-meta{font-size:9px;color:#333;margin-top:2px}
.msg-tool{font-size:10px;color:#B54EA0;background:#1a0e18;padding:4px 8px;border-radius:4px;margin-top:4px;border:1px solid #2e0e22}

.info-col{width:280px;border-left:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.mpanel{border-bottom:1px solid #1a1a1a;overflow:hidden}
.mph{padding:6px 12px;background:#111;display:flex;justify-content:space-between;align-items:center}
.mph .ml{font-size:10px;font-weight:700;color:#378ADD}
.mph .ms{font-size:8px;color:#444}
.mpb{padding:6px 12px;font-size:10px;line-height:1.6;color:#555;white-space:pre-wrap;word-break:break-word;max-height:100px;overflow-y:auto}
#flow-log{flex:1;overflow-y:auto;padding:6px 12px;font-size:9px;color:#333;line-height:1.7}
.fl-s{color:#BA7517}.fl-ok{color:#1D9E75}.fl-t{color:#B54EA0}.fl-w{color:#e24b4b}

.input-bar{padding:8px 16px;border-top:1px solid #1a1a1a;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
textarea{flex:1;padding:8px 10px;font-size:12px;font-family:inherit;border:1px solid #222;border-radius:6px;background:#0a0a0a;color:#c2c0b6;line-height:1.4;resize:none;transition:border-color .2s}
textarea:focus{outline:none;border-color:#444}
textarea::placeholder{color:#222}
#send-btn{padding:8px 14px;font-size:11px;font-family:inherit;border:1px solid #222;border-radius:6px;background:transparent;color:#c2c0b6;cursor:pointer;white-space:nowrap;height:50px;transition:all .15s}
#send-btn:hover:not(:disabled){background:#151515;border-color:#444}
#send-btn:disabled{opacity:.25;cursor:not-allowed}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#222;border-radius:3px}
</style>
</head>
<body>
<div class="top-bar">
  <div>
    <div class="title">SEODAERY BRAIN MAP</div>
    <div class="sub">v0.4 -- Single Model Architecture</div>
  </div>
  <div id="badge">connecting...</div>
</div>

<div class="pipeline">
  <div class="pipe" id="s-input" data-c="#888780"><span class="dot" style="background:#888780"></span><span class="nm">INPUT</span><div class="sm">receive</div></div>
  <div class="pipe" id="s-queue" data-c="#BA7517"><span class="dot" style="background:#BA7517"></span><span class="nm">QUEUE</span><div class="sm">enqueue</div></div>
  <div class="pipe" id="s-gen" data-c="#378ADD"><span class="dot" style="background:#378ADD"></span><span class="nm">9B</span><div class="sm">generate</div></div>
  <div class="pipe" id="s-tool" data-c="#B54EA0"><span class="dot" style="background:#B54EA0"></span><span class="nm">TOOL</span><div class="sm">if needed</div></div>
  <div class="pipe" id="s-done" data-c="#1D9E75"><span class="dot" style="background:#1D9E75"></span><span class="nm">DONE</span><div class="sm">respond</div></div>
</div>

<div class="main">
  <div class="chat-col">
    <div id="chat-log"></div>
  </div>
  <div class="info-col">
    <div class="mpanel">
      <div class="mph"><span class="ml">9B MODEL</span><span class="ms" id="m-status">idle</span></div>
      <div class="mpb" id="m-info">Qwen3.5-9B | single model</div>
    </div>
    <div id="flow-log"></div>
  </div>
</div>

<div class="input-bar">
  <textarea id="inp" rows="2" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="send-btn" onclick="send()">전송</button>
</div>

<script>
const API=location.origin;
let busy=false;
let userId=localStorage.getItem('sdr_uid')||'brain_'+Math.random().toString(36).slice(2,10);
localStorage.setItem('sdr_uid',userId);

(async function boot(){
  const b=document.getElementById('badge');
  for(let i=0;i<60;i++){
    try{const r=await fetch(API+'/api/queue/status');if(r.ok){b.textContent='online';b.style.color='#1D9E75';b.style.borderColor='#1D9E75';return}}catch(e){}
    b.textContent='connecting '+'·'.repeat((i%3)+1);await sleep(2000);
  }
  b.textContent='offline';b.style.color='#e24b4b';
})();

let ws;
function connectWS(){
  try{
    ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws/queue');
    ws.onclose=()=>setTimeout(connectWS,3000);
  }catch(e){}
}
connectWS();

function setP(id,on){const el=document.getElementById('s-'+id);if(!el)return;const c=el.dataset.c;if(on){el.style.opacity='1';el.style.borderColor=c;el.style.background=c+'18';el.classList.add('pulse')}else{el.style.opacity='.3';el.style.borderColor='#1a1a1a';el.style.background='transparent';el.classList.remove('pulse')}}
function clearP(){['input','queue','gen','tool','done'].forEach(s=>setP(s,false))}
function setBadge(t,c){const b=document.getElementById('badge');b.textContent=t;b.style.color=c||'#555';b.style.borderColor=c||'#333'}
function setModel(s,c){const el=document.getElementById('m-status');el.textContent=s;el.style.color=c||'#444'}
function lock(){busy=true;document.getElementById('send-btn').disabled=true;document.getElementById('send-btn').textContent='...'}
function unlock(){busy=false;document.getElementById('send-btn').disabled=false;document.getElementById('send-btn').textContent='전송'}
function flog(m,c){const el=document.getElementById('flow-log');const ts=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});el.innerHTML+='<div><span style="color:#222">['+ts+']</span> <span class="'+(c||'')+'">'+ m+'</span></div>';el.scrollTop=el.scrollHeight}
function addMsg(role,text,model){const log=document.getElementById('chat-log');const cls=role==='user'?'msg-user':role==='bot'?'msg-bot':'msg-sys';const name=role==='user'?'나':role==='bot'?'서대리':'SYSTEM';let meta='';if(model)meta='<div class="msg-meta">'+model+'</div>';log.innerHTML+='<div class="msg '+cls+'"><div class="msg-name">'+name+'</div><div class="msg-text">'+esc(text)+'</div>'+meta+'</div>';log.scrollTop=log.scrollHeight}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}

async function send(){
  if(busy)return;
  const inp=document.getElementById('inp');
  const msg=inp.value.trim();
  if(!msg)return;
  inp.value='';lock();
  addMsg('user',msg);
  clearP();setP('input',true);setBadge('input','#888780');
  flog('INPUT: "'+msg.substring(0,40)+'"','fl-s');

  try{
    setP('input',false);setP('queue',true);
    setBadge('queued','#BA7517');
    const chatData=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-User-Id':userId},body:JSON.stringify({message:msg})}).then(r=>r.json());
    if(chatData.duplicate){addMsg('sys','중복 요청');unlock();return}
    if(!chatData.request_id){addMsg('sys','전송 실패');unlock();return}

    setP('queue',false);setP('gen',true);
    setBadge('generating','#378ADD');
    setModel('working...','#BA7517');
    flog('9B generating...','fl-s');

    const rid=chatData.request_id;
    const poll=setInterval(async()=>{
      try{
        const r=await fetch(API+'/api/chat/'+rid,{headers:{'X-User-Id':userId}});
        const d=await r.json();
        if(d.status==='completed'||d.status==='error'){
          clearInterval(poll);
          addMsg('bot',d.content||'(응답 없음)',d.model_used);
          setP('gen',false);setP('done',true);
          setBadge('done','#1D9E75');
          setModel('done','#1D9E75');
          flog('response: '+(d.model_used||'?'),'fl-ok');
          setTimeout(()=>{clearP();setBadge('online','#1D9E75');setModel('idle','#444')},2000);
          unlock();
        }
      }catch(e){}
    },800);
  }catch(e){
    addMsg('sys','오류: '+e.message);
    setBadge('error','#e24b4b');flog('ERROR: '+e.message,'fl-w');
    clearP();unlock();
  }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
