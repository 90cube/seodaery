services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  router-model:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: >
      --model /models/router-0.8b.gguf
      --ctx-size 2048
      --n-gpu-layers 99
      --port 8080
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  executor-model:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8082:8080"
    volumes:
      - ./models:/models
    command: >
      --model /models/executor-14b.gguf
      --ctx-size 4096
      --n-gpu-layers 99
      --port 8080
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
